adapter_kind: external_transport
# Sensor range is owned by the supplied Physical Runtime scenario configuration
# (harbor_world.yaml: runtime.max_visibility_distance_m = 300 m). It arrives as
# controlled_vehicle.fov_radius in both initial planning and live snapshots.
# Do not override it here or substitute the fake environment's sensing_radius.
protocols:
  maneuver_command: 1
  maneuver_feedback: 1
  environment_data: 2
  perception: 1
updates:
  ownership: coordinator_driven
  cadence_seconds: 0.5
topics:
  command_target: maneuver-adapter
  command: maneuver
  feedback: maneuver-feedback
  perception: environment-perceptions
  environment_data: environment-data
  context: planning-evidence
supported_actions:
  - navigate
  - takeoff
  - land
  - search_area
  - pursue
  - investigate
external:
  runtime_repository: /data/ccu/sukaih/ONR/onr_physical_runtime
  planning_topic: environment-planning
  update_topic: environment-updates
  control_topic: environment-control
  planning_artifact_root: var/environment
  coordinate_frame: local_ned
  mission_epoch: environment_reset
  altitude_convention: ned_down_metres
  max_retries: 3
  update_stale_after_seconds: 2
  advance_timeout_seconds: 30
