[package]
name = "operator-console"
version = "0.1.0"
edition = "2024"
description = "Ratatui Operator Console for the local onr Runtime Host"
publish = false

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ureq = { version = "3", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
unicode-width = "0.2"
# Inline world frames and hierarchical progress. Only PNG/JPEG decoders are
# enabled; chafa is not required.
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
tui-tree-widget = "0.24"
