[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onr-agent-slim"
version = "0.1.0"
description = "Autonomous mission-control agents and runtime composition."
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "langchain",
    "langchain-openai",
    "python-statemachine",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest", "playwright", "pyright", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/onr"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["live: requires the pre-running vLLM endpoint and real solver pipeline"]
