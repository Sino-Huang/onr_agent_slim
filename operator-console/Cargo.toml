[package]
name = "operator-console"
version = "0.1.0"
edition = "2024"
description = "Ratatui Operator Console for the local onr Runtime Host"
publish = false

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
ureq = { version = "3", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
