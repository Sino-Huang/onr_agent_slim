debug: true
llm:
  provider: vllm
  base_url: http://127.0.0.1:11411/v1
  model: google/gemma-4-31B-it
  api_key: EMPTY
  temperature: 0
planners:
  temporal:
    entrypoint: modules/MiniZincIDE-2.9.7-bundle-linux-x86_64/bin/minizinc
    timeout_seconds: 30
  symbolic:
    entrypoint: modules/downward/fast-downward.py
    timeout_seconds: 30
heartbeats:
  hyper_seconds: 30
  maneuver_seconds: 5
  summary_seconds: 30
transport:
  backend: file
  root: var/transport
storage:
  root: var/storage
services:
  hyper_agent: hyper-agent
  maneuver_control: maneuver-control
  context_coordination: context-coordination
  fsm_runner: fsm-runner
  planner: planner
